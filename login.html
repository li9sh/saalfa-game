<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>فُلّة | تسجيل الدخول وإنشاء حساب</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background: #0f172a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(236, 72, 153, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 75%, rgba(139, 92, 246, 0.15) 0%, transparent 40%);
    }

    /* --- Navbar --- */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 40px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(236, 72, 153, 0.2);
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(236, 72, 153, 0.4);
      padding: 6px 18px;
      border-radius: 40px;
    }

    .brand-logo .name {
      font-size: 1.7rem;
      font-weight: 900;
      background: linear-gradient(45deg, #ec4899, #8b5cf6, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-back {
      color: #cbd5e1;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    .btn-back:hover {
      color: #ec4899;
    }

    /* --- Auth Container --- */
    .auth-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .auth-card {
      background: rgba(30, 41, 59, 0.75);
      border: 2px solid rgba(236, 72, 153, 0.3);
      border-radius: 24px;
      width: 100%;
      max-width: 440px;
      padding: 35px 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(236, 72, 153, 0.15);
      backdrop-filter: blur(10px);
    }

    /* Social Login Buttons */
    .social-auth {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .btn-social {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 11px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 0.95rem;
      text-decoration: none;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .btn-social:hover {
      transform: translateY(-2px);
    }

    .btn-tiktok {
      background: #000;
      border-color: #ff0050;
      box-shadow: 0 0 10px rgba(255, 0, 80, 0.2);
    }

    .btn-twitch {
      background: #9146FF;
      border-color: #a970ff;
      box-shadow: 0 0 10px rgba(145, 70, 255, 0.3);
    }

    .btn-google {
      background: #ffffff;
      color: #000;
      border-color: #ddd;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: #64748b;
      margin: 20px 0;
      font-size: 0.85rem;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .divider span {
      padding: 0 10px;
    }

    /* Tabs (التبويب) */
    .auth-tabs {
      display: flex;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 14px;
      padding: 5px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: linear-gradient(45deg, #ec4899, #8b5cf6);
      color: #fff;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
    }

    /* Forms */
    .auth-form {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .auth-form.active {
      display: flex;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: bold;
      color: #cbd5e1;
    }

    .form-group input {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 12px;
      padding: 11px 14px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #ec4899;
      box-shadow: 0 0 10px rgba(236, 72, 153, 0.2);
    }

    .btn-submit {
      background: linear-gradient(45deg, #ec4899, #8b5cf6);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      margin-top: 5px;
      box-shadow: 0 6px 20px rgba(236, 72, 153, 0.35);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(236, 72, 153, 0.5);
    }

    .form-footer {
      text-align: center;
      margin-top: 10px;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .form-footer a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: bold;
    }

    /* دخول سريع بكود الغرفة */
    .btn-room-direct {
      width: 100%;
      padding: 12px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid #38bdf8;
      border-radius: 12px;
      color: #38bdf8;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
      margin-top: 15px;
    }

    .btn-room-direct:hover {
      background: rgba(56, 189, 248, 0.2);
    }

    @media (max-width: 480px) {
      .navbar { padding: 12px 20px; }
      .auth-card { padding: 25px 20px; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="brand-logo">
      <span class="name">فُلّة</span>
    </a>
    <a href="index.html" class="btn-back">➔ العودة للرئيسية</a>
  </nav>

  <main class="auth-wrapper">
    <div class="auth-card">
      
      <!-- أزرار التوثيق الاجتماعية المفعلة بـ Supabase -->
      <div class="social-auth">
        <button class="btn-social btn-tiktok" onclick="socialLogin('tiktok')">
          🎵 الدخول بواسطة TikTok
        </button>
        <button class="btn-social btn-twitch" onclick="socialLogin('twitch')">
          👾 الدخول بواسطة Twitch
        </button>
        <button class="btn-social btn-google" onclick="socialLogin('google')">
          🌐 الدخول بواسطة Google
        </button>
      </div>

      <div class="divider">
        <span>أو عبر البريد الإلكتروني</span>
      </div>

      <div class="auth-tabs">
        <button class="tab-btn active" onclick="switchTab('login')">تسجيل الدخول</button>
        <button class="tab-btn" onclick="switchTab('signup')">حساب جديد</button>
      </div>

      <!-- نموذج تسجيل الدخول -->
      <form id="login-form" class="auth-form active" onsubmit="handleAuth(event, 'login')">
        <div class="form-group">
          <label>البريد الإلكتروني</label>
          <input type="email" placeholder="example@mail.com" required />
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <input type="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-submit">دخول 🚀</button>
        <div class="form-footer">
          <a href="#">نسيت كلمة المرور؟</a>
        </div>
      </form>

      <!-- نموذج إنشاء حساب -->
      <form id="signup-form" class="auth-form" onsubmit="handleAuth(event, 'signup')">
        <div class="form-group">
          <label>اسم المستخدم (الاسم باللعبة)</label>
          <input type="text" placeholder="مثال: البطل_1" required />
        </div>
        <div class="form-group">
          <label>البريد الإلكتروني</label>
          <input type="email" placeholder="example@mail.com" required />
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <input type="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-submit">إنشاء الحساب ✨</button>
      </form>

      <div class="divider">
        <span>أو ادخل كلاعب سريع</span>
      </div>

      <button class="btn-room-direct" onclick="enterRoomDirectly()">
        🔑 إدخال كود غرفة بدون تسجيل
      </button>

    </div>
  </main>

  <!-- استدعاء مكتبة Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // 1. إعدادات السيرفر والمفاتيح الخاطة بـ Supabase
    const SUPABASE_URL = 'https://uhwlxlejpzkyomimuepy.supabase.co'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_1yTJSFyNBoNUrBQ5pCApGA_gWkB5ugD';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. التحقق التلقائي عند فتح الصفحة أو عند العودة من التوثيق الخارجي
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (session) {
        console.log('المستخدم مسجّل الدخول:', session.user);
        window.location.href = 'index.html';
      }
    });

    // 3. دالة تسجيل الدخول عبر شبكات التواصل (Google, Twitch, TikTok)
    async function socialLogin(providerName) {
      try {
        const currentUrl = window.location.href.split('#')[0].split('?')[0];
        const targetUrl = currentUrl.substring(0, currentUrl.lastIndexOf('/')) + '/index.html';

        const { data, error } = await supabaseClient.auth.signInWithOAuth({
          provider: providerName,
          options: {
            redirectTo: targetUrl
          }
        });

        if (error) throw error;
      } catch (err) {
        alert('حدث خطأ أثناء الاتصال بـ ' + providerName + ': ' + err.message);
      }
    }

    // 4. دالة التبديل بين التبويبات (تسجيل دخول / حساب جديد)
    function switchTab(tab) {
      const loginForm = document.getElementById('login-form');
      const signupForm = document.getElementById('signup-form');
      const tabs = document.querySelectorAll('.tab-btn');

      if (tab === 'login') {
        loginForm.classList.add('active');
        signupForm.classList.remove('active');
        tabs[0].classList.add('active');
        tabs[1].classList.remove('active');
      } else {
        signupForm.classList.add('active');
        loginForm.classList.remove('active');
        tabs[1].classList.add('active');
        tabs[0].classList.remove('active');
      }
    }

    // 5. دالة التسجيل بالبريد الإلكتروني وكلمة المرور
    async function handleAuth(e, type) {
      e.preventDefault();
      const email = e.target.querySelector('input[type="email"]').value;
      const password = e.target.querySelector('input[type="password"]').value;

      if (type === 'signup') {
        const { data, error } = await supabaseClient.auth.signUp({ email, password });
        if (error) alert(error.message);
        else alert('تم إنشاء الحساب بنجاح! تفقد بريدك الإلكتروني للتفعيل.');
      } else {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) alert(error.message);
        else {
          alert('تم تسجيل الدخول بنجاح! 🎉');
          window.location.href = 'index.html';
        }
      }
    }

    // 6. الدخول المباشر للغرفة
    function enterRoomDirectly() {
      const code = prompt('أدخل كود الغرفة (مثال: 4821):');
      if (code) {
        alert(`جاري الانضمام للغرفة رقم: ${code}`);
      }
    }
  </script>
</body>
</html>
