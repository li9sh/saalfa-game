<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عجلة الروليت 🎡 | فُلّة</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background: #0f172a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px;
    }

    .main-container {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 24px;
      padding: 24px;
      width: 100%;
      max-width: 650px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .back-home-btn {
      display: inline-block;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 12px;
      font-weight: bold;
      border: 1px solid rgba(255, 255, 255, 0.2);
      margin-bottom: 15px;
      float: right;
    }

    h1 {
      clear: both;
      font-size: 2rem;
      font-weight: 900;
      background: linear-gradient(45deg, #ec4899, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 25px;
    }

    /* قسم إدخال الأسماء أولاً */
    .controls-section {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 20px;
      text-align: right;
      margin-bottom: 20px;
    }

    .controls-section h3 {
      font-size: 1.1rem;
      color: #fff;
      margin-bottom: 12px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .input-group input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 12px;
      border: 2px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .input-group input:focus {
      border-color: #ec4899;
    }

    .input-group button {
      background: linear-gradient(45deg, #ec4899, #8b5cf6);
      color: #fff;
      border: none;
      padding: 12px 22px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .input-group button:hover {
      opacity: 0.9;
    }

    .options-list {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      max-height: 160px;
      overflow-y: auto;
      padding: 5px 2px;
    }

    .options-list li {
      background: rgba(236, 72, 153, 0.15);
      border: 1px solid #ec4899;
      color: #fff;
      padding: 8px 16px;
      border-radius: 25px;
      font-size: 0.95rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .options-list li button {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .create-btn {
      width: 100%;
      background: linear-gradient(45deg, #10b981, #059669);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 1.15rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
      transition: 0.2s;
    }

    .create-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
    }

    /* منطقة اللعبة والأنماط (مخفية افتراضياً) */
    .game-section {
      margin-top: 20px;
      border-top: 1px solid #334155;
      padding-top: 20px;
      animation: fadeIn 0.4s ease-in-out;
    }

    .hidden {
      display: none !important;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #94a3b8;
      margin: 10px 0 12px 0;
      text-align: right;
    }

    /* الأزرار جنب بعض (النمط الأول والنمط الثاني) */
    .modes-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    .mode-card {
      background: rgba(15, 23, 42, 0.6);
      border: 2px solid #334155;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
    }

    .mode-card:hover {
      border-color: #ec4899;
    }

    .mode-card.active {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
    }

    .mode-icon { font-size: 2rem; margin-bottom: 8px; }
    .mode-name { font-size: 1.05rem; font-weight: bold; color: #fff; }
    .mode-desc { font-size: 0.8rem; color: #94a3b8; margin-top: 4px; }

    /* النمط الأول: العجلة */
    .wheel-box {
      position: relative;
      width: 300px;
      height: 300px;
      margin: 15px auto 20px auto;
    }

    .pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 24px solid #ec4899;
      z-index: 10;
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 4px solid #334155;
    }

    /* النمط الثاني: شريط الأسماء العمودي */
    .slot-box {
      display: none;
      height: 120px;
      background: #0f172a;
      border: 3px solid #ec4899;
      border-radius: 20px;
      align-items: center;
      justify-content: center;
      margin: 25px 0;
      box-shadow: inset 0 0 20px rgba(236, 72, 153, 0.2);
    }

    .slot-text {
      font-size: 2.2rem;
      font-weight: 900;
      color: #38bdf8;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    #spinBtn {
      width: 100%;
      background: linear-gradient(45deg, #ec4899, #8b5cf6);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
      transition: 0.2s;
    }

    #spinBtn:active { transform: scale(0.98); }

    .result-box {
      margin-top: 20px;
      padding: 15px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #334155;
      border-radius: 14px;
    }

    .result-box span { color: #94a3b8; font-size: 0.95rem; }
    .result-box h2 { color: #38bdf8; font-size: 1.6rem; font-weight: 900; margin-top: 5px; }
  </style>
</head>
<body>

  <div class="main-container">
    <a href="freeGames.html" class="back-home-btn">🏠 العودة للرئيسية</a>

    <h1>🎡 عجلة الروليت</h1>
    <p class="subtitle">أدخل الأسماء أو الخيارات أولاً، ثم اضغط إنشاء الروليت!</p>

    <!-- 1. إدخال الأسماء والخيارات -->
    <div class="controls-section">
      <h3>📝 أدخل الأسماء والخيارات</h3>
      <div class="input-group">
        <input type="text" id="optionInput" placeholder="اكتب اسماً واضغط إضافة..." onkeypress="handleKeyPress(event)">
        <button onclick="addOption()">إضافة ➕</button>
      </div>

      <!-- الأسماء تظهر مباشرة تحت حقل الإدخال -->
      <ul id="optionsList" class="options-list"></ul>

      <button class="create-btn" onclick="buildRoulette()">إنشاء الروليت 🎡</button>
    </div>

    <!-- 2. منطقة القرعة (تظهر بعد الضغط على إنشاء الروليت) -->
    <div id="gameSection" class="game-section hidden">
      <div class="section-title">⚙️ اختر نمط الاختيار:</div>
      
      <!-- اختيار الأنماط جنب بعضها -->
      <div class="modes-grid">
        <div class="mode-card active" id="modeWheel" onclick="switchMode('wheel')">
          <div class="mode-icon">🎡</div>
          <div class="mode-name">العجلة الدوارة</div>
          <div class="mode-desc">النمط الكلاسيكي بالألوان</div>
        </div>
        <div class="mode-card" id="modeSlot" onclick="switchMode('slot')">
          <div class="mode-icon">↕️</div>
          <div class="mode-name">شريط الأسماء</div>
          <div class="mode-desc">أسماء تجري بشكل رأسي</div>
        </div>
      </div>

      <!-- النمط 1: العجلة -->
      <div class="wheel-box" id="wheelBox">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="300" height="300"></canvas>
      </div>

      <!-- النمط 2: شريط الأسماء العمودي -->
      <div class="slot-box" id="slotBox">
        <div class="slot-text" id="slotText">جاهز لـ السحب!</div>
      </div>

      <!-- زر التشغيل -->
      <button id="spinBtn" onclick="spinWheel()">ابدأ الاختيار 🚀</button>

      <!-- النتيجة -->
      <div id="resultBox" class="result-box hidden">
        <span>🎉 الفائز هو:</span>
        <h2 id="resultText">---</h2>
      </div>
    </div>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'tick') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, now);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.03);
        osc.start(now);
        osc.stop(now + 0.03);
      } else if (type === 'win') {
        const notes = [400, 500, 600, 800];
        notes.forEach((freq, idx) => {
          const oscV = audioCtx.createOscillator();
          const gainV = audioCtx.createGain();
          oscV.connect(gainV);
          gainV.connect(audioCtx.destination);
          oscV.frequency.setValueAtTime(freq, now + idx * 0.1);
          gainV.gain.setValueAtTime(0.15, now + idx * 0.1);
          gainV.gain.linearRampToValueAtTime(0.01, now + idx * 0.1 + 0.12);
          oscV.start(now + idx * 0.1);
          oscV.stop(now + idx * 0.1 + 0.12);
        });
      }
    }

    let currentMode = 'wheel';
    let options = [];
    const colors = ['#ec4899', '#8b5cf6', '#38bdf8', '#10b981', '#f59e0b', '#ef4444', '#6366f1'];

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    let startAngle = 0;
    let isSpinning = false;

    function renderOptions() {
      const list = document.getElementById('optionsList');
      list.innerHTML = "";
      options.forEach((opt, index) => {
        const li = document.createElement('li');
        li.innerHTML = `<span>${opt}</span><button onclick="removeOption(${index})">✕</button>`;
        list.appendChild(li);
      });
      if (!document.getElementById('gameSection').classList.contains('hidden')) {
        drawWheel();
      }
    }

    function addOption() {
      const input = document.getElementById('optionInput');
      const val = input.value.trim();
      if (val) {
        options.push(val);
        input.value = "";
        renderOptions();
      }
    }

    function removeOption(index) {
      options.splice(index, 1);
      renderOptions();
      if (options.length < 2) {
        document.getElementById('gameSection').classList.add('hidden');
      }
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') addOption();
    }

    function buildRoulette() {
      if (options.length < 2) {
        alert("يرجى إدخال اسمين أو خيارين على الأقل لإنشاء الروليت!");
        return;
      }
      const gameSection = document.getElementById('gameSection');
      gameSection.classList.remove('hidden');
      drawWheel();
      gameSection.scrollIntoView({ behavior: 'smooth' });
    }

    function switchMode(mode) {
      if (isSpinning) return;
      currentMode = mode;
      document.getElementById('modeWheel').classList.toggle('active', mode === 'wheel');
      document.getElementById('modeSlot').classList.toggle('active', mode === 'slot');
      
      document.getElementById('wheelBox').style.display = mode === 'wheel' ? 'block' : 'none';
      document.getElementById('slotBox').style.display = mode === 'slot' ? 'flex' : 'none';
      document.getElementById('resultBox').classList.add('hidden');
    }

    function drawWheel() {
      const num = options.length;
      if (num === 0) return;
      const arc = (2 * Math.PI) / num;
      const radius = canvas.width / 2;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      options.forEach((opt, i) => {
        const angle = startAngle + i * arc;
        ctx.beginPath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.moveTo(radius, radius);
        ctx.arc(radius, radius, radius, angle, angle + arc);
        ctx.lineTo(radius, radius);
        ctx.fill();

        ctx.save();
        ctx.translate(radius, radius);
        ctx.rotate(angle + arc / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#fff";
        ctx.font = "bold 14px Tajawal";
        ctx.fillText(opt, radius - 18, 5);
        ctx.restore();
      });
    }

    function spinWheel() {
      if (isSpinning || options.length === 0) return;
      isSpinning = true;
      document.getElementById('resultBox').classList.add('hidden');
      document.getElementById('spinBtn').disabled = true;

      if (currentMode === 'wheel') {
        const spinAngle = Math.random() * 1000 + 2000;
        const duration = 4000;
        const startTime = performance.now();

        function animate(time) {
          const elapsed = time - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const easeOut = 1 - Math.pow(1 - progress, 3);
          startAngle = (spinAngle * easeOut) * (Math.PI / 180);
          drawWheel();

          if (Math.random() < (1 - progress) * 0.3) playSound('tick');

          if (progress < 1) {
            requestAnimationFrame(animate);
          } else {
            const winner = getWheelWinner();
            finishSpin(winner);
          }
        }
        requestAnimationFrame(animate);
      } else {
        const slotText = document.getElementById('slotText');
        let counter = 0;
        const interval = setInterval(() => {
          slotText.innerText = options[Math.floor(Math.random() * options.length)];
          playSound('tick');
          counter++;
          if (counter > 30) {
            clearInterval(interval);
            const winner = options[Math.floor(Math.random() * options.length)];
            slotText.innerText = winner;
            finishSpin(winner);
          }
        }, 90);
      }
    }

    function getWheelWinner() {
      const num = options.length;
      let degrees = (startAngle * (180 / Math.PI)) % 360;
      let degreesFromTop = (270 - degrees + 360) % 360;
      let winnerIndex = Math.floor(degreesFromTop / (360 / num));
      return options[winnerIndex];
    }

    function finishSpin(winner) {
      isSpinning = false;
      document.getElementById('spinBtn').disabled = false;
      document.getElementById('resultText').innerText = winner;
      document.getElementById('resultBox').classList.remove('hidden');
      playSound('win');
      confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 } });
    }
  </script>
</body>
</html>
