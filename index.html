<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>فُلّة | الرئيسية والعجلة التفاعلية</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background: #0f172a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(236, 72, 153, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 75%, rgba(139, 92, 246, 0.15) 0%, transparent 40%);
    }

    /* --- Navbar --- */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 40px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(236, 72, 153, 0.2);
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(236, 72, 153, 0.4);
      padding: 6px 18px;
      border-radius: 40px;
    }

    .brand-logo .name {
      font-size: 1.7rem;
      font-weight: 900;
      background: linear-gradient(45deg, #ec4899, #8b5cf6, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .user-section {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .nav-btn {
      background: linear-gradient(45deg, #ec4899, #8b5cf6);
      color: #fff;
      text-decoration: none;
      padding: 8px 20px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.95rem;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
      transition: transform 0.2s;
    }

    .nav-btn:hover {
      transform: translateY(-2px);
    }

    .profile-view {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(30, 41, 59, 0.8);
      padding: 6px 16px;
      border-radius: 30px;
      border: 1px solid rgba(139, 92, 246, 0.3);
    }

    .player-name {
      font-weight: bold;
      color: #38bdf8;
    }

    .logout-btn {
      background: rgba(244, 63, 94, 0.2);
      color: #f43f5e;
      border: 1px solid #f43f5e;
      padding: 4px 12px;
      border-radius: 15px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .logout-btn:hover {
      background: rgba(244, 63, 94, 0.4);
    }

    .hidden {
      display: none !important;
    }

    /* --- App Container --- */
    .main-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      display: flex;
      flex-direction: row-reverse;
      gap: 40px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      max-width: 1000px;
      width: 100%;
    }

    /* --- Wheel Section --- */
    .wheel-section {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .pointer {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 30px solid #f43f5e;
      z-index: 10;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.4));
    }

    canvas {
      border-radius: 50%;
      box-shadow: 0 0 25px rgba(236, 72, 153, 0.3), 0 0 10px rgba(0, 0, 0, 0.5);
      background: #1e293b;
    }

    .spin-btn {
      margin-top: 25px;
      background: linear-gradient(45deg, #ec4899, #8b5cf6);
      color: #fff;
      border: none;
      padding: 14px 40px;
      border-radius: 50px;
      font-size: 1.2rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(236, 72, 153, 0.4);
      transition: all 0.2s ease;
    }

    .spin-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(236, 72, 153, 0.6);
    }

    .spin-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* --- Controls Section --- */
    .controls-section {
      background: rgba(30, 41, 59, 0.75);
      border: 1px solid rgba(236, 72, 153, 0.3);
      padding: 25px;
      border-radius: 20px;
      width: 100%;
      max-width: 380px;
      backdrop-filter: blur(10px);
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .input-group input {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .input-group input:focus {
      border-color: #8b5cf6;
    }

    .add-btn {
      background: #8b5cf6;
      color: #fff;
      border: none;
      padding: 0 18px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .add-btn:hover {
      background: #7c3aed;
    }

    .options-list {
      list-style: none;
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .options-list li {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 10px 14px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }

    .delete-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
    }

    /* --- Result Box --- */
    .result-box {
      margin-top: 20px;
      padding: 15px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      border-radius: 12px;
      text-align: center;
    }

    .result-box h3 {
      color: #10b981;
      font-size: 0.95rem;
      margin-bottom: 5px;
    }

    .result-box div {
      font-size: 1.5rem;
      font-weight: 900;
      color: #fff;
    }

    @media (max-width: 480px) {
      .navbar { padding: 12px 20px; }
      .container { gap: 25px; }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="index.html" class="brand-logo">
      <span class="name">فُلّة</span>
    </a>

    <div class="user-section" id="user-section">
      <!-- أزرار وواجهة المستخدم التي يتم التحكم بها عبر script.js -->
      <a href="login.html" id="login-btn" class="nav-btn">تسجيل الدخول</a>

      <div id="profile-view" class="profile-view hidden">
        <span id="player-name" class="player-name">🎮 اللاعب</span>
        <button onclick="logout()" class="logout-btn">خروج</button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-wrapper">
    <div class="container">
      
      <!-- قسم العجلة -->
      <div class="wheel-section">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="360" height="360"></canvas>
        <button class="spin-btn" id="spinBtn" onclick="spinWheel()">🎉 أدِر العجلة</button>
      </div>

      <!-- قسم التحكم بالخيارات -->
      <div class="controls-section">
        <h2 style="margin-bottom: 15px; font-size: 1.3rem;">🎯 خيارات العجلة</h2>
        
        <div class="input-group">
          <input type="text" id="optionInput" placeholder="أدخل اسم أو خيار..." onkeypress="handleKeyPress(event)" />
          <button class="add-btn" onclick="addOption()">إضافة</button>
        </div>

        <ul class="options-list" id="optionsList"></ul>

        <!-- مربع النتيجة -->
        <div class="result-box hidden" id="resultBox">
          <h3>🏆 الفائز هو:</h3>
          <div id="resultText">-</div>
        </div>
      </div>

    </div>
  </main>

  <!-- مكتبة Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- ملف السكربت الخاص بك -->
  <script src="script.js"></script>
</body>
</html>
