<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة الألعاب الجماعية 🎮</title>
  <link rel="stylesheet" href="style.css">
  
</head>
<body>

  <div class="main-container home-container">
    <header class="platform-header">
      <span class="logo-icon">🎮</span>
      <h1>منصة الألعاب الجماعية</h1>
      <p class="subtitle">اختر اللعبة وابدأ الحماس مع أصدقائك مباشرة!</p>
    </header>

    <!-- قائمة بطاقات الألعاب -->
    <div class="games-grid">
      
      <!-- بطاقة لعبة العجلة -->
      <div class="game-card" onclick="location.href='wheel.html'">
        <div class="card-icon">🎡</div>
        <h2>عجلة القرارات</h2>
        <p>أدر العجلة لاتخاذ قرارات عشوائية وإضافة التحديات والأسماء.</p>
        <button class="play-btn">لعب الآن 🚀</button>
      </div>

      <!-- بطاقة لعبة خارج السالفة -->
      <div class="game-card" onclick="location.href='liar.html'">
        <div class="card-icon">🕵️‍♂️</div>
        <h2>خارج السالفة</h2>
        <p>اكتشف اللاعب الكذاب الذي لا يعرف الكلمة السرية من خلال التلميحات!</p>
        <button class="play-btn">لعب الآن 🚀</button>
      </div>

    </div>

    <footer class="platform-footer">
      <p>جاهز لتجربة ألعاب أكثر؟ قريباً نظام الغرف والتفاعل أونلاين 🌐</p>
    </footer>
  </div>

</body>
</html>
