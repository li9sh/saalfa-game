<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الكلمة المفقودة | فُلّة 🧩</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet" />
  <!-- مكتبة الاحتفالات (Confetti) -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background: #0f172a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .top-bar {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 12px;
      font-weight: bold;
      transition: 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-back:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .game-card {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 24px;
      padding: 30px;
      width: 100%;
      max-width: 550px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }

    .score-board {
      display: flex;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.6);
      padding: 12px 20px;
      border-radius: 16px;
      margin-bottom: 25px;
      font-weight: bold;
      color: #38bdf8;
    }

    .emoji-hint {
      font-size: 3.8rem;
      margin: 15px 0;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .hint-text {
      color: #94a3b8;
      font-size: 1.15rem;
      margin-bottom: 20px;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.6;
    }

    .timer-container {
      width: 100%;
      background: #334155;
      height: 10px;
      border-radius: 10px;
      margin-bottom: 25px;
      overflow: hidden;
    }

    .timer-bar {
      height: 100%;
      background: linear-gradient(90deg, #ec4899, #8b5cf6);
      width: 100%;
      transition: width 1s linear;
    }

    .input-box {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      border: 2px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 1.2rem;
      text-align: center;
      outline: none;
      margin-bottom: 18px;
      transition: border-color 0.2s;
    }

    .input-box:focus {
      border-color: #ec4899;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(45deg, #ec4899, #8b5cf6);
      color: #fff;
      border: none;
      padding: 15px;
      border-radius: 14px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    .btn-submit:hover {
      opacity: 0.9;
      transform: scale(1.02);
    }

    .result-msg {
      margin-top: 18px;
      font-size: 1.2rem;
      font-weight: bold;
      min-height: 30px;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="index.html" class="btn-back">⬅ الرئيسية</a>
    <h2>الكلمة المفقودة 🧩</h2>
  </div>

  <div class="game-card">
    <div class="score-board">
      <span>النقاط: <strong id="score" style="color:#ec4899">0</strong></span>
      <span>السؤال: <strong id="step" style="color:#8b5cf6">1</strong> / <span id="total-steps">0</span></span>
    </div>

    <div class="timer-container">
      <div class="timer-bar" id="timer-bar"></div>
    </div>

    <div class="emoji-hint" id="emojis">🎯</div>
    <div class="hint-text" id="hint">جاري تحميل اللغز...</div>

    <input type="text" id="answerInput" class="input-box" placeholder="اكتب الكلمة المفقودة هنا..." autocomplete="off" />
    <button class="btn-submit" onclick="checkAnswer()">تأكيد الإجابة ✨</button>

    <div class="result-msg" id="result"></div>
  </div>

  <script>
    // قائمة الألغاز
    const puzzles = [
      { emojis: "🧠 ⚡", hint: "العقل السليم في الجسم ......؟", answer: "السليم" },
      { emojis: "🦁 👑", hint: "الأسد هو ملك ......؟", answer: "الغابة" },
      { emojis: "☕ 🌅", hint: "خير ما تبدأ به صباحك هو فنجان ......؟", answer: "قهوة" },
      { emojis: "🔑 🚪", hint: "الصبر مفتاح ......؟", answer: "الفرج" },
      { emojis: "🦅 🇸🇦", hint: "عاصمة المملكة العربية السعودية هي ......؟", answer: "الرياض" },
      { emojis: "🌙 ✨", hint: "الشهر الذي يصوم فيه المسلمون هو ......؟", answer: "رمضان" },
      { emojis: "💻 ⚡", hint: "لغة العصر وتطوير المواقع هي البرمجة في عالم ......؟", answer: "الحاسوب" },
      { emojis: "🤝 ❤️", hint: "الصديق وقت ......؟", answer: "الضيق" }
    ];

    let currentStep = 0;
    let score = 0;
    let timeLeft = 15;
    let timerInterval;

    document.getElementById('total-steps').innerText = puzzles.length;

    // تشغيل مؤثرات صوتية بسيطة
    function playAudioSound(type) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      if (type === 'success') {
        osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
        osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
        gain.gain.fadeOut(0.3);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } else {
        osc.frequency.setValueAtTime(220, ctx.currentTime);
        osc.frequency.setValueAtTime(180, ctx.currentTime + 0.1);
        gain.gain.fadeOut(0.3);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      }
    }

    function loadPuzzle() {
      if (currentStep >= puzzles.length) {
        showFinalResult();
        return;
      }

      const p = puzzles[currentStep];
      document.getElementById('emojis').innerText = p.emojis;
      document.getElementById('hint').innerText = p.hint;
      document.getElementById('answerInput').value = "";
      document.getElementById('result').innerText = "";
      document.getElementById('step').innerText = currentStep + 1;

      startTimer();
    }

    function startTimer() {
      clearInterval(timerInterval);
      timeLeft = 15;
      const timerBar = document.getElementById('timer-bar');
      timerBar.style.width = '100%';

      timerInterval = setInterval(() => {
        timeLeft--;
        timerBar.style.width = (timeLeft / 15 * 100) + '%';

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          document.getElementById('result').innerText = "⏱️ انتهى الوقت! الإجابة الصحيحة: " + puzzles[currentStep].answer;
          document.getElementById('result').style.color = "#f43f5e";
          playAudioSound('error');
          setTimeout(nextPuzzle, 2000);
        }
      }, 1000);
    }

    function checkAnswer() {
      const userAns = document.getElementById('answerInput').value.trim();
      const currentAns = puzzles[currentStep].answer;

      if (!userAns) return;

      if (userAns === currentAns || userAns.includes(currentAns)) {
        clearInterval(timerInterval);
        score += 10;
        document.getElementById('score').innerText = score;
        document.getElementById('result').innerText = "🎉 إجابة صحيحة! بطل!";
        document.getElementById('result').style.color = "#34d399";
        
        playAudioSound('success');
        confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });

        setTimeout(nextPuzzle, 1500);
      } else {
        document.getElementById('result').innerText = "❌ إجابة خاطئة، حاول مرة أخرى!";
        document.getElementById('result').style.color = "#f43f5e";
        playAudioSound('error');
      }
    }

    function nextPuzzle() {
      currentStep++;
      loadPuzzle();
    }

    function showFinalResult() {
      clearInterval(timerInterval);
      confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } });
      
      const card = document.querySelector('.game-card');
      card.innerHTML = `
        <h1 style="font-size: 2.5rem; margin-bottom: 15px; color: #ec4899;">🏆 انقضى التحدي!</h1>
        <p style="font-size: 1.3rem; margin-bottom: 25px;">مجموع نقاطك النهائي: <strong style="color: #38bdf8; font-size: 1.8rem;">${score}</strong> من ${puzzles.length * 10}</p>
        <button class="btn-submit" onclick="location.reload()">إعادة اللعب 🔄</button>
      `;
    }

    // السماح بالضغط على Enter للارسال
    document.getElementById('answerInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        checkAnswer();
      }
    });

    // لبدء اللعبة
    loadPuzzle();
  </script>
</body>
</html>
