<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول | المنصة</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background: #0f172a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(236, 72, 153, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 40%);
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
      background: rgba(30, 41, 59, 0.75);
      border: 1px solid rgba(236, 72, 153, 0.3);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 35px 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(236, 72, 153, 0.15);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand-logo {
      font-size: 2.5rem;
      margin-bottom: 8px;
      display: inline-block;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .brand-title {
      font-size: 1.8rem;
      font-weight: 900;
      background: linear-gradient(45deg, #ec4899, #8b5cf6, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-top: 5px;
    }

    /* أزرار الدخول الاجتماعي (Google & Twitch) */
    .social-auth {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .btn-social {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      border: 1px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
    }

    .btn-google {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .btn-google:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: #fff;
    }

    .btn-twitch {
      background: rgba(145, 71, 255, 0.15);
      border-color: #9147ff;
      color: #a970ff;
    }

    .btn-twitch:hover {
      background: #9147ff;
      color: #fff;
      box-shadow: 0 0 15px rgba(145, 71, 255, 0.4);
    }

    .btn-social svg {
      width: 20px;
      height: 20px;
    }

    /* Tabs للتبديل */
    .auth-tabs {
      display: flex;
      background: rgba(15, 23, 42, 0.6);
      padding: 5px;
      border-radius: 14px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .tab-btn.active {
      background: linear-gradient(45deg, #ec4899, #8b5cf6);
      color: #fff;
      box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 0.88rem;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid #334155;
      border-radius: 12px;
      color: #fff;
      font-size: 0.98rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input:focus {
      border-color: #ec4899;
      box-shadow: 0 0 12px rgba(236, 72, 153, 0.25);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(45deg, #ec4899, #8b5cf6);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(236, 72, 153, 0.35);
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 8px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(236, 72, 153, 0.5);
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 18px 0;
      color: #64748b;
      font-size: 0.85rem;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #334155;
    }

    .divider span {
      padding: 0 10px;
    }

    .btn-room-direct {
      width: 100%;
      padding: 12px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid #38bdf8;
      border-radius: 12px;
      color: #38bdf8;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .btn-room-direct:hover {
      background: rgba(56, 189, 248, 0.2);
    }

    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.82rem;
      color: #64748b;
    }

    .auth-footer a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <!-- Header -->
    <div class="brand-header">
      <div class="brand-logo">🚀</div>
      <h1 class="brand-title">أهلاً بك معنا</h1>
      <p class="brand-subtitle">سجل دخولك أو أنشئ حسابك لبدء التحدي</p>
    </div>

    <!-- أزرار الدخول السريع عبر Google و Twitch -->
    <div class="social-auth">
      <!-- Google -->
      <button class="btn-social btn-google" onclick="loginWithSocial('Google')">
        <svg viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        الدخول بواسطة Google
      </button>

      <!-- Twitch -->
      <button class="btn-social btn-twitch" onclick="loginWithSocial('Twitch')">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M11.571 4.714h1.715v5.143h-1.715zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/>
        </svg>
        الدخول بواسطة Twitch
      </button>
    </div>

    <!-- فاصل -->
    <div class="divider">
      <span>أو البريد والإلكتروني / الرقم</span>
    </div>

    <!-- Tabs للتبديل -->
    <div class="auth-tabs">
      <button class="tab-btn active" onclick="switchTab('login')">تسجيل الدخول</button>
      <button class="tab-btn" onclick="switchTab('register')">حساب جديد</button>
    </div>

    <!-- نموذج تسجيل الدخول -->
    <form id="login-form" onsubmit="handleAuth(event, 'login')">
      <div class="form-group">
        <label class="form-label">رقم الجوال أو البريد الإلكتروني</label>
        <input type="text" class="form-input" placeholder="05xxxxxxxx أو name@example.com" required />
      </div>

      <div class="form-group">
        <label class="form-label">كلمة المرور</label>
        <input type="password" class="form-input" placeholder="••••••••" required />
      </div>

      <button type="submit" class="btn-submit">تسجيل الدخول ➔</button>
    </form>

    <!-- نموذج إنشاء حساب جديد -->
    <form id="register-form" style="display: none;" onsubmit="handleAuth(event, 'register')">
      <div class="form-group">
        <label class="form-label">الاسم أو اللقب باللعبة</label>
        <input type="text" class="form-input" placeholder="مثال: اللاعب الخارق" required />
      </div>

      <div class="form-group">
        <label class="form-label">رقم الجوال</label>
        <input type="tel" class="form-input" placeholder="05xxxxxxxx" required />
      </div>

      <div class="form-group">
        <label class="form-label">كلمة المرور</label>
        <input type="password" class="form-input" placeholder="أنشئ كلمة مرور قوية" required />
      </div>

      <button type="submit" class="btn-submit">أنشئ الحساب الآن ✨</button>
    </form>

    <!-- دخول سريع باستخدام كود الغرفة -->
    <div class="divider">
      <span>أو ادخل كلاعب سريع</span>
    </div>

    <button class="btn-room-direct" onclick="enterRoomDirectly()">
      <span>🔑</span> إدخال كود غرفة بدون تسجيل
    </button>

    <div class="auth-footer">
      بإكمال التسجيل أنت توافق على <a href="#">الشروط والأحكام</a> و <a href="#">سياسة الخصوصية</a>
    </div>
  </div>

  <script>
    function switchTab(type) {
      const loginForm = document.getElementById('login-form');
      const registerForm = document.getElementById('register-form');
      const tabs = document.querySelectorAll('.tab-btn');

      if (type === 'login') {
        loginForm.style.display = 'block';
        registerForm.style.display = 'none';
        tabs[0].classList.add('active');
        tabs[1].classList.remove('active');
      } else {
        loginForm.style.display = 'none';
        registerForm.style.display = 'block';
        tabs[0].classList.remove('active');
        tabs[1].classList.add('active');
      }
    }

    function handleAuth(event, type) {
      event.preventDefault();
      alert(type === 'login' ? 'تم تسجيل الدخول بنجاح!' : 'تم إنشاء الحساب بنجاح!');
      window.location.href = 'index.html';
    }

    function loginWithSocial(platform) {
      alert(`جاري توجيهك لتسجيل الدخول عبر ${platform}...`);
    }

    function enterRoomDirectly() {
      const code = prompt('أدخل كود الغرفة (مثال: 4821):');
      if (code) {
        alert(`جاري الانضمام للغرفة رقم: ${code}`);
      }
    }
  </script>
</body>
</html>
