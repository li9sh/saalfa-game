  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background: #0f172a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin: 30px 0 20px;
    }

    /* تصميم لوقو "فُلّة | Fulla" */
    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      background: rgba(30, 41, 59, 0.85);
      border: 2px solid rgba(236, 72, 153, 0.5);
      padding: 12px 30px;
      border-radius: 50px;
      box-shadow: 0 0 25px rgba(236, 72, 153, 0.3);
      margin-bottom: 15px;
      backdrop-filter: blur(10px);
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .brand-logo:hover {
      transform: scale(1.03);
      border-color: rgba(236, 72, 153, 0.8);
    }

    .brand-icon {
      font-size: 2.3rem;
      animation: pulseGlow 1.8s infinite alternate;
    }

    .brand-text {
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(45deg, #ec4899, #8b5cf6, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    @keyframes pulseGlow {
      0% { transform: scale(1) rotate(-5deg); filter: drop-shadow(0 0 4px rgba(236, 72, 153, 0.5)); }
      100% { transform: scale(1.15) rotate(5deg); filter: drop-shadow(0 0 12px rgba(139, 92, 246, 0.9)); }
    }

    header p {
      color: #94a3b8;
      font-size: 1.15rem;
    }

    .games-container {
      display: flex;
      flex-wrap: wrap;
      gap: 25px;
      justify-content: center;
      max-width: 1000px;
      width: 100%;
      margin-top: 25px;
    }

    .game-card {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 20px;
      padding: 25px;
      width: 300px;
      text-align: center;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .game-card:hover {
      transform: translateY(-8px);
      border-color: #ec4899;
      box-shadow: 0 10px 25px rgba(236, 72, 153, 0.25);
    }

    /* أبعاد ثابتة وحجم أصغر وموحد لجميع أيقونات الألعاب */
    .game-icon {
      width: 54px;
      height: 54px;
      font-size: 1.6rem;
      line-height: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px auto;
      flex-shrink: 0;
    }

    .game-title {
      font-size: 1.6rem;
      margin-bottom: 10px;
      color: #f8fafc;
    }

    .game-desc {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .btn-play {
      background: linear-gradient(45deg, #ec4899, #8b5cf6);
      color: #fff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 1.1rem;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .btn-play:hover {
      opacity: 0.9;
      transform: scale(1.03);
    }

    .how-to-play {
      margin-top: 50px;
      max-width: 800px;
      text-align: center;
      background: rgba(30, 41, 59, 0.5);
      padding: 30px;
      border-radius: 20px;
      border: 1px solid #334155;
    }

    .how-to-play h2 {
      margin-bottom: 20px;
      color: #ec4899;
    }

    .steps {
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 20px;
    }

    .step {
      flex: 1;
      min-width: 200px;
